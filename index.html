<meta charset="utf-8">
<meta name="author" content="jaehee">
<meta name="author-email" content="sakura1004jh@gmail.com">
<meta name="version" content="v1.0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차곡</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1F6F5C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#EEF0E6;
    --surface:#FFFFFF;
    --surface-alt:#F7F8F1;
    --ink:#1D231C;
    --ink-soft:#5B6358;
    --ink-faint:#8B9285;
    --line:#DBDFCE;
    --line-strong:#C6CBB6;
    --brand:#1F6F5C;
    --brand-strong:#175A4B;
    --brand-ink:#FFFFFF;
    --income:#2454A6;
    --expense:#B4362B;
    --good:#2F7A56;
    --warning:#B8862B;
    --critical:#B4362B;
    --shadow: 0 1px 2px rgba(29,35,28,0.06), 0 8px 24px -12px rgba(29,35,28,0.18);
    --cat-1:#2a78d6; --cat-2:#c25a1f; --cat-3:#1baf7a; --cat-4:#b3810a;
    --cat-5:#c15c85; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
    --cat-other:#8B9285;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#14181A;
      --surface:#1B2126;
      --surface-alt:#1F262B;
      --ink:#EDEFE6;
      --ink-soft:#A9B0A3;
      --ink-faint:#6E756A;
      --line:#2B3339;
      --line-strong:#3A444B;
      --brand:#4FBBA0;
      --brand-strong:#6BCBB3;
      --brand-ink:#0E1512;
      --income:#7EA6E8;
      --expense:#E2786C;
      --good:#5FBE8F;
      --warning:#D9A94F;
      --critical:#E2786C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      --cat-1:#3987e5; --cat-2:#d9762f; --cat-3:#199e70; --cat-4:#c98500;
      --cat-5:#d97fa2; --cat-6:#4bc14b; --cat-7:#9085e9; --cat-8:#e66767;
      --cat-other:#6E756A;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#14181A;
    --surface:#1B2126;
    --surface-alt:#1F262B;
    --ink:#EDEFE6;
    --ink-soft:#A9B0A3;
    --ink-faint:#6E756A;
    --line:#2B3339;
    --line-strong:#3A444B;
    --brand:#4FBBA0;
    --brand-strong:#6BCBB3;
    --brand-ink:#0E1512;
    --income:#7EA6E8;
    --expense:#E2786C;
    --good:#5FBE8F;
    --warning:#D9A94F;
    --critical:#E2786C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --cat-1:#3987e5; --cat-2:#d9762f; --cat-3:#199e70; --cat-4:#c98500;
    --cat-5:#d97fa2; --cat-6:#4bc14b; --cat-7:#9085e9; --cat-8:#e66767;
    --cat-other:#6E756A;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.brand-word{
    font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    font-weight:800;
    text-wrap:balance;
    margin:0;
  }
  .num{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--brand);color:var(--brand-ink);}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- shell layout ---------- */
  #shell{
    display:grid;
    grid-template-columns: 232px 1fr;
    min-height:100vh;
  }
  #sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:24px 16px;
    display:flex;
    flex-direction:column;
    gap:28px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:0 8px;
  }
  .brand-word{font-size:1.5rem;color:var(--ink);}
  .brand-sub{font-size:0.72rem;color:var(--ink-faint);letter-spacing:0.04em;}
  nav.tabs{display:flex;flex-direction:column;gap:2px;}
  nav.tabs.bottom{display:none;}
    #session-bar{display:none;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;width:100%;max-width:1080px;margin:0 auto;}
  #session-bar .session-label{font-size:0.78rem;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  #session-bar select{padding:6px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-alt);color:var(--ink);font-size:0.9rem;cursor:pointer;font-family:inherit;}
  #session-bar .btn{margin-left:auto;}
  #session-bar .btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  @media (max-width:860px){
    #session-bar{padding:10px 16px;max-width:100%;}
  }
  .tab-btn{
    display:flex;align-items:center;gap:12px;
    padding:11px 12px;border-radius:10px;border:none;background:transparent;
    color:var(--ink-soft);font-size:0.95rem;text-align:left;cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .tab-btn .ic{width:20px;height:20px;flex:none;display:inline-flex;}
  .tab-btn:hover{background:var(--surface-alt);color:var(--ink);}
  .tab-btn[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:600;}
  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;}
  .save-state{font-size:0.72rem;color:var(--ink-faint);padding:0 8px;display:flex;align-items:center;gap:6px;}
  .save-dot{width:6px;height:6px;border-radius:999px;background:var(--good);flex:none;}
  .save-dot.pending{background:var(--warning);}
  .save-dot.off{background:var(--ink-faint);}

  #main{padding:28px 32px 96px;max-width:1080px;overflow:visible;}
#main.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-title{font-size:1.5rem;}
  .page-desc{color:var(--ink-soft);font-size:0.88rem;margin-top:4px;}

  /* ---------- cards / stat tiles ---------- */
  .grid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat-card.hero{background:linear-gradient(155deg, color-mix(in oklab, var(--brand) 10%, var(--surface)), var(--surface));border-color:var(--brand);}
  .stat-label{font-size:0.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .stat-value{font-size:1.5rem;margin-top:6px;}
  .stat-value.income{color:var(--income);}
  .stat-value.expense{color:var(--expense);}
  .stat-caption{font-size:0.72rem;color:var(--ink-faint);margin-top:4px;}
    .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;box-shadow:var(--shadow);
    display:block;width:100%;overflow:visible;min-height:auto;
  }
  .card + .card{margin-top:16px;}
  .card-head{
    display:grid;grid-template-columns:1fr 160px 200px;align-items:center;margin-bottom:14px;gap:8px;
    padding-bottom:12px;border-bottom:2px solid var(--line);height:28px;
  }
  .card-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.3px;}
  /* settings 섹션별 색상 테마 */
  #main .card:nth-child(2) .card-head{border-bottom-color:var(--brand);}
  #main .card:nth-child(2) .card-title{color:var(--brand);}
  #main .card:nth-child(3) .card-head{border-bottom-color:var(--expense);}
  #main .card:nth-child(3) .card-title{color:var(--expense);}
  #main .card:nth-child(4) .card-head{border-bottom-color:var(--income);}
  #main .card:nth-child(4) .card-title{color:var(--income);}
  #main .card:nth-child(5) .card-head{border-bottom-color:var(--brand);}
  #main .card:nth-child(5) .card-title{color:var(--brand);}

  /* settings section (카테고리별 - 박스 없음) */
  .settings-section{margin-top:28px;margin-bottom:28px;}
  .settings-section-head{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:2px solid var(--line);
  }
  .settings-section-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.3px;}
  /* 카테고리별 색상 테마 */
  #main .settings-section:nth-of-type(1) .settings-section-head{border-bottom-color:var(--brand);}
  #main .settings-section:nth-of-type(1) .settings-section-title{color:var(--brand);}
  #main .settings-section:nth-of-type(2) .settings-section-head{border-bottom-color:var(--expense);}
  #main .settings-section:nth-of-type(2) .settings-section-title{color:var(--expense);}
  #main .settings-section:nth-of-type(3) .settings-section-head{border-bottom-color:var(--income);}
  #main .settings-section:nth-of-type(3) .settings-section-title{color:var(--income);}
  #main .settings-section:nth-of-type(4) .settings-section-head{border-bottom-color:var(--brand);}
  #main .settings-section:nth-of-type(4) .settings-section-title{color:var(--brand);}

  /* 설정 탭: 모든 배경 제거 */
  #main.settings-view [data-settings-container]{background:transparent;}
  #main.settings-view .bd-items{background:transparent;}
  #main.settings-view .bd-group{background:transparent;}
  #main.settings-view .catrow{background:none;}
  #main.settings-view .catrow:hover{background:transparent;}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 16px;border-radius:10px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:0.88rem;cursor:pointer;
    transition:transform .08s ease, background .12s ease;
  }
  .btn:hover{background:var(--surface-alt);}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600;}
  .btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);}
  .btn-danger{color:var(--expense);border-color:var(--expense);background:transparent;}
  .btn-ghost{color:var(--ink-soft);border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-alt);color:var(--ink);}
  .btn-sm{padding:6px 11px;font-size:0.8rem;border-radius:8px;}
  .btn-icon{padding:8px;border-radius:9px;}
  .btn-block{width:100%;}
  .fab{
    position:fixed;right:28px;bottom:28px;z-index:40;
    width:56px;height:56px;border-radius:999px;border:none;
    background:var(--brand);color:var(--brand-ink);font-size:1.6rem;line-height:1;
    box-shadow:0 10px 24px -6px rgba(0,0,0,0.35);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:scale(0.95);}

  /* ---------- chips / filters ---------- */
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{
    padding:7px 13px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink-soft);font-size:0.82rem;cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;}
  select.sel, input.sel{
    padding:7px 12px;border-radius:9px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:0.82rem;
  }
  input.sel::placeholder{color:var(--ink-faint);}
  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav .btn-icon{width:32px;height:32px;padding:0;}
  .month-label{font-weight:700;font-size:1.15rem;min-width:104px;text-align:center;}

  /* ---------- 비용·수익 (breakdown) ---------- */
  .period-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
  .seg{display:inline-flex;background:var(--surface-alt);border-radius:10px;padding:3px;gap:2px;}
  .seg-btn{
    border:none;background:none;color:var(--ink-soft);font-size:0.84rem;font-weight:600;
    padding:7px 14px;border-radius:8px;cursor:pointer;
  }
  .seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,0.08);}
  .range-inputs{display:flex;align-items:center;gap:8px;}
  .range-inputs input[type="date"]{
    padding:7px 10px;border-radius:9px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:0.82rem;
  }
  .breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .breakdown-panel .card-head{margin-bottom:12px;}
  .card-head>:nth-child(2){align-self:center;}
  .card-head>:nth-child(3){align-self:center;}
  .breakdown-total{font-size:1.05rem;font-weight:700;text-align:right;}
  .bd-total-row{display:flex;align-items:center;gap:6px;margin:0;width:100%;height:22px;}
  .barlist-track{display:flex;align-items:center;justify-content:flex-start;height:6px;}
  .bd-group{padding:0;border-bottom:none;background:none;border-radius:0;margin-bottom:0;overflow:visible;min-height:auto;}
  .bd-group:last-child{border-bottom:none;}
  .bd-group-head{
    width:100%;display:flex;align-items:center;gap:0;background:none;border:none;
    padding:6px 12px;cursor:pointer;color:var(--ink);text-align:left;font:inherit;height:28px;
    margin-bottom:0;border-bottom:1px solid var(--line);transition:none;border-radius:0;font-weight:600;font-size:0.9rem;
  }
  .bd-group-head .bd-chev{flex:0 0 14px;}
  .bd-group-head .bd-group-name{flex:1;min-width:0;margin-left:6px;}
  .bd-group-head .barlist-track{flex:0 0 140px;max-width:140px;}
  .bd-group-head .bd-group-pct{flex:0 0 50px;text-align:right;}
  .bd-group-head .bd-group-amt{flex:0 0 170px;text-align:right;}
  .bd-group-head:hover{background:var(--surface-alt);}
  .bd-group-head:last-of-type{border-bottom:none;}
  .bd-chev{display:inline-flex;width:14px;height:14px;color:var(--ink-faint);transform:rotate(90deg);transition:transform .15s ease;flex:none;}
  .bd-chev svg{width:14px;height:14px;display:block;}
  .bd-chev.collapsed{transform:rotate(0deg);}
  .bd-group-name{font-weight:700;font-size:0.85rem;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bd-group-pct{font-size:0.78rem;min-width:34px;text-align:right;flex:none;}
  .bd-group-amt{font-size:0.9rem;min-width:88px;text-align:right;flex:none;}
  .bd-inline-track{width:100%;flex:none;}
  .bd-items{margin-top:0;padding-left:24px;background:var(--surface);border:none;display:block;width:100%;overflow:visible;min-height:auto;}
  @media (max-width: 720px){
    .breakdown-grid{grid-template-columns:1fr;}
    .bd-group-amt{min-width:auto;}
    .bd-inline-track{width:40px;}
  }

  /* ---------- 대시보드 (dashboard) ---------- */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .dash-card{margin-top:0;}
  .dash-rows{display:flex;flex-direction:column;}
  .dash-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .dash-row:last-child{border-bottom:none;}
  .dash-row.sub{padding:7px 0;padding-left:10px;}
  .dash-row.sub .dash-label{color:var(--ink-soft);font-size:0.82rem;}
  .dash-row.sub .dash-val{font-size:0.88rem;font-weight:600;}
  .dash-label{color:var(--ink-soft);font-size:0.88rem;}
  .dash-val{font-weight:700;font-size:0.98rem;text-align:right;}
  .dash-pct{color:var(--ink-faint);font-size:0.78rem;font-weight:500;}
  @media (max-width: 720px){
    .dash-grid{grid-template-columns:1fr;}
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;
  }
  .toolbar-row{display:flex;gap:8px;flex-wrap:wrap;}
  .toolbar-search{flex:1;min-width:160px;}
  .toolbar-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .toolbar-fields .field{margin-bottom:0;}
  .toolbar-fields .field label{font-size:0.72rem;}
  .toolbar-fields .field input[type="text"], .toolbar-fields .field input[type="number"], .toolbar-fields .field input[type="date"], .toolbar-fields .field select{padding:6px 10px;font-size:0.8rem;}
  .toolbar-fields .field input:disabled{opacity:0.5;}

  /* ---------- ledger table (desktop) ---------- */
  .desktop-only{display:block;}
  .mobile-only{display:none;}
  .ledger-table-wrap{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow-x:auto;
  }
  table.ledger-table{width:100%;border-collapse:collapse;font-size:0.86rem;}
  .ledger-table thead th{
    text-align:left;font-weight:600;color:var(--ink-soft);font-size:0.74rem;
    letter-spacing:0.02em;padding:10px 14px;border-bottom:1px solid var(--line-strong);
    background:var(--surface-alt);position:sticky;top:0;white-space:nowrap;
  }
  .ledger-table thead th.num{text-align:right;}
  .ledger-table tbody tr.ledger-tr{border-bottom:1px solid var(--line);cursor:pointer;}
  .ledger-table tbody tr.ledger-tr:last-child{border-bottom:none;}
  .ledger-table tbody tr.ledger-tr:hover{background:var(--surface-alt);}
  .ledger-table td{padding:10px 14px;vertical-align:middle;}
  .ledger-table td.num{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .lt-date{white-space:nowrap;color:var(--ink-soft);}
  .lt-item{min-width:120px;}
  .lt-memo{display:block;font-size:0.76rem;color:var(--ink-faint);margin-top:2px;}
  .lt-acct{white-space:nowrap;}
  .lt-amt.income{color:var(--income);}
  .lt-amt.expense{color:var(--expense);}
  .lt-bal{color:var(--ink-soft);}
  .dot-sm{width:10px;height:10px;border-radius:999px;display:inline-block;margin-right:6px;vertical-align:middle;}
  .dot-sm.dot-icon{width:auto;height:auto;border-radius:0;font-size:0.8rem;margin-right:4px;}

  /* ---------- ledger list (mobile cards) ---------- */
  .day-group{margin-bottom:6px;}
  .day-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:14px 4px 6px;font-size:0.8rem;color:var(--ink-faint);
    border-bottom:1px dashed var(--line);
  }
  .day-head .d-total{font-size:0.78rem;}
  .tx-row{
    display:grid;grid-template-columns:34px 1fr auto auto;align-items:center;gap:12px;
    padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .tx-row:hover{background:var(--surface-alt);}
  .swatch{width:10px;height:10px;border-radius:999px;flex:none;}
  .dot-wrap{width:34px;height:34px;border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:1rem;}
  .tx-main .tx-cat{font-size:0.94rem;display:flex;align-items:center;gap:6px;}
  .tx-main .tx-sub{font-size:0.76rem;color:var(--ink-faint);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
  .tx-amt{font-size:0.98rem;text-align:right;}
  .tx-amt.income{color:var(--income);}
  .tx-amt.expense{color:var(--expense);}
  .tx-chev{color:var(--ink-faint);text-align:right;}
  .tx-chev svg{width:16px;height:16px;display:block;}

  if(session){
    state.groups = session.groups;
    state.accounts = session.accounts;
    state.budgets = session.budgets;
    state.transactions = session.transactions;
  }
}

function syncSessionWithState(){
  // state의 변경사항을 현재 세션에 반영
  var session = currentSession();
  if(session){
    session.groups = state.groups;
    session.accounts = state.accounts;
    session.budgets = state.budgets;
    session.transactions = state.transactions;
  }
}

function switchSession(sessionId){
  if(state.sessions[sessionId]){
    syncSessionWithState();
    ui.activeSessionId = sessionId;
    state.activeSessionId = sessionId;
    syncStateWithSession();
    saveState();
    saveUi();

    ui.ledgerDebitAccount = "all";
    ui.ledgerCreditAccount = "all";
    ui.ledgerItemQuery = "";
    ui.ledgerMemoQuery = "";

    ui.ledgerAmountTo = "";

    render();
  }
}

  state.sessions[sessionId] = {
    id: sessionId,
    name: name,
    createdAt: todayIso(),
    groups: defaultSessionData ? JSON.parse(JSON.stringify(defaultSessionData.groups)) : [],
    accounts: defaultSessionData ? JSON.parse(JSON.stringify(defaultSessionData.accounts)) : [],
    budgets: {},
    transactions: []
  };
  switchSession(sessionId);
  return sessionId;
}

function deleteSession(sessionId){
  if(Object.keys(state.sessions).length <= 1){
    alert("최소 1개의 가계부는 유지해야 합니다");
    return false;
  }
  delete state.sessions[sessionId];
  if(state.activeSessionId === sessionId){
    state.activeSessionId = Object.keys(state.sessions)[0];
    switchSession(state.activeSessionId);

  saveState();

}

function duplicateSession(sessionId, mode){

    id: newSessionId,

    groups: JSON.parse(JSON.stringify(source.groups)),
    accounts: JSON.parse(JSON.stringify(source.accounts)),

    transactions: mode==="full" ? JSON.parse(JSON.stringify(source.transactions)) : []

  state.sessions[newSessionId] = newSession;

var artifactPromise = null;
function getArtifact(){
  if(!artifactPromise){
    artifactPromise = (window.claude && window.claude.use) ? window.claude.use("artifact") : Promise.resolve(null);

/* Captured lazily (not at top-level script scope): this script tag is still
   being parsed/executed when top-level code runs, so per the HTML parsing spec
   anything after THIS script's own closing tag - including our end marker below -
   is not in the DOM yet at that point. buildDocument() is only ever called from
   commit(), itself only triggered by a user action well after the full document
   (and any platform wrapper around it) has finished loading, so capturing on
   first use is always safe. */
var _originalHtmlCache = null;
function getOriginalHtml(){
  if(_originalHtmlCache===null) _originalHtmlCache = document.documentElement.outerHTML;
  return _originalHtmlCache;
}
function buildDocument(newState){
  var json = JSON.stringify(newState).replace(/<\//g, "<\\/");
  var html = getOriginalHtml();
  /* The Artifact platform wraps whatever we publish in its own <html>/<head>/<body>
     skeleton, so document.documentElement.outerHTML at runtime already includes
     that wrapper (plus whatever the platform injected into it). Re-publishing the
     whole outerHTML would nest another wrapper inside it on every save, compounding
     with each edit. These markers bound our own content only, so we always extract
     and republish just that - never the platform's wrapper - keeping every future
     republish byte-for-byte equivalent in shape to the very first one. */
  var startMarker = "<!--CHAGOK:START-->", endMarker = "<!--CHAGOK:END-->";
  /* indexOf for the start (the real one is physically first in the file, before
     this function's own mention of the string below); lastIndexOf for the end,
     since this function's own mention of endMarker comes BEFORE the real closing
     marker at the bottom of the file - indexOf would find that mention instead
     and truncate the document mid-script. */
  var s = html.indexOf(startMarker);
  var e = html.lastIndexOf(endMarker);
  var src = (s>-1 && e>-1 && e>s) ? html.slice(s, e + endMarker.length) : html;
  var out = src.replace(
    /(<script id="state-data" type="application\/json">)[\s\S]*?(<\/script>)/,
    function(m, open, close){ return open + "\n" + json + "\n" + close; }
  );
  return out;
}

var saveStatus = "idle";
function setSaveStatus(s){
  saveStatus = s;
  ["save-dot","save-dot-m"].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.className = "save-dot" + (s==="pending"?" pending":s==="error"?" off":"");
  });
  var t = document.getElementById("save-text");
  if(t) t.textContent = s==="pending" ? "저장 중" : s==="error" ? "이 기기에 저장됨" : "저장됨";
}

async function commit(mutator){
  var next = mutator(JSON.parse(JSON.stringify(state)));
  state = next;
  closeModal();
  saveUi();
  render();
  setSaveStatus("pending");
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  var artifact = await getArtifact();
  if(!artifact){ setSaveStatus("error"); return; }
  try{
    await artifact.publish(buildDocument(state));
  }catch(err){
    if(err && err.code === "conflict"){
      /* reload incoming; nothing to do */
    }else{
      setSaveStatus("error");
      toast("저장하지 못했어요. 이 기기에는 남아있어요.");
    }
  }
}

/* ================= helpers ================= */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function monthKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function monthLabel(mk){
  var parts = mk.split("-"); return parts[0]+"년 "+parseInt(parts[1],10)+"월";
}
function shiftMonth(mk, delta){
  var parts = mk.split("-").map(Number);
  var d = new Date(parts[0], parts[1]-1+delta, 1);
  return monthKey(d);
}
function monthEndDate(mk){
  var parts = mk.split("-").map(Number);
  var d = new Date(parts[0], parts[1], 0);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function todayIso(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fmtWon(n){
  var neg = n<0; n = Math.abs(Math.round(n));
  var s = n.toLocaleString("ko-KR");
  return (neg?"-":"")+"₩"+s;
}
function fmtDateShort(iso){
  var p = iso.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]);
  var days=["일","월","화","수","목","금","토"];
  return parseInt(p[1],10)+"."+parseInt(p[2],10)+" ("+days[d.getDay()]+")";
}
function acctById(id){
  for(var i=0;i<state.accounts.length;i++) if(state.accounts[i].id===id) return state.accounts[i];
  return null;
}
function clsOf(id){ var a = acctById(id); return a ? a.cls : null; }
function acctsByCls(cls){ return state.accounts.filter(function(a){ return a.cls===cls; }); }
function groupById(id){
  if(!id) return null;
  for(var i=0;i<state.groups.length;i++) if(state.groups[i].id===id) return state.groups[i];
  return null;
}
function groupsByCls(cls){ return state.groups.filter(function(g){ return g.cls===cls; }); }
/* Groups items of a class into { ungrouped:[...], groups:[{group, items}] }, group order
   follows state.groups' own order, and empty groups are still included so they can be
   seen/edited/deleted even before anything is filed under them. */
function groupedAccts(cls){
  var all = acctsByCls(cls);
  var ungrouped = all.filter(function(a){ return !a.groupId || !groupById(a.groupId); });
  var out = groupsByCls(cls).map(function(g){
    return { group:g, items: all.filter(function(a){ return a.groupId===g.id; }) };
  });
  return { ungrouped: ungrouped, groups: out };
}
function swatchVar(sw){ return "var(--cat-"+(sw||"other")+")"; }
function isDebitNormal(cls){ return cls==="asset" || cls==="expense"; }

/* ---- reordering (move up/down within the list an item is currently shown in) ----
   There's no explicit order field: the array position in state.groups / state.accounts
   IS the display order (groupedAccts filters preserve relative order), so "move" finds
   the item's neighbor in its CURRENT visible list and swaps their positions in the
   underlying array. */
function swapArrayById(arr, idA, idB){
  var iA = -1, iB = -1;
  for(var i=0;i<arr.length;i++){ if(arr[i].id===idA) iA=i; if(arr[i].id===idB) iB=i; }
  if(iA<0 || iB<0) return;
  var tmp = arr[iA]; arr[iA] = arr[iB]; arr[iB] = tmp;
}
function neighborIdInList(list, id, dir){
  var idx = -1;
  for(var i=0;i<list.length;i++) if(list[i].id===id){ idx=i; break; }
  if(idx<0) return null;
  var swapIdx = dir==="up" ? idx-1 : idx+1;
  if(swapIdx<0 || swapIdx>=list.length) return null;
  return list[swapIdx].id;
}
function moveGroup(cls, groupId, dir){
  var list = groupsByCls(cls);
  var otherId = neighborIdInList(list, groupId, dir);
  if(!otherId) return;
  commit(function(s){ swapArrayById(s.groups, groupId, otherId); return s; });
}
function moveItem(cls, groupIdOrNull, itemId, dir){
  var g = groupedAccts(cls);
  var bucket = groupIdOrNull ? g.groups.find(function(x){ return x.group.id===groupIdOrNull; }) : null;
  var list = groupIdOrNull ? (bucket ? bucket.items : []) : g.ungrouped;
  var otherId = neighborIdInList(list, itemId, dir);
  if(!otherId) return;
  commit(function(s){ swapArrayById(s.accounts, itemId, otherId); return s; });
}

function accountBalanceAsOf(id, asOfDate){
  var acc = acctById(id); if(!acc) return 0;
  var debitNormal = isDebitNormal(acc.cls);
  var bal = acc.initial || 0;
  state.transactions.forEach(function(t){
    if(asOfDate && t.date > asOfDate) return;
    if(t.debitId===id) bal += debitNormal ? t.amount : -t.amount;
    else if(t.creditId===id) bal += debitNormal ? -t.amount : t.amount;
  });
  return bal;
}
function accountBalance(id){ return accountBalanceAsOf(id, null); }
function totalByCls(cls, asOfDate){
  var sum=0;
  acctsByCls(cls).forEach(function(a){ sum += accountBalanceAsOf(a.id, asOfDate); });
  return sum;
}
function netWorthAsOf(asOfDate){ return totalByCls("asset", asOfDate) - totalByCls("liability", asOfDate); }

function txInMonth(mk){
  return state.transactions.filter(function(t){ return t.date.slice(0,7)===mk; });
}
function monthSummary(mk){
  var income=0, expense=0;
  txInMonth(mk).forEach(function(t){
    if(clsOf(t.creditId)==="income") income += t.amount;
    if(clsOf(t.debitId)==="expense") expense += t.amount;
  });
  return {income:income, expense:expense, net:income-expense};
}
function categoryBreakdown(mk, cls){
  var map = {};
  txInMonth(mk).forEach(function(t){
    if(cls==="expense" && clsOf(t.debitId)==="expense"){ map[t.debitId]=(map[t.debitId]||0)+t.amount; }
    else if(cls==="income" && clsOf(t.creditId)==="income"){ map[t.creditId]=(map[t.creditId]||0)+t.amount; }
  });
  var rows = Object.keys(map).map(function(id){
    var a = acctById(id);
    return {id:id, name:a?a.name:"기타", swatch:a?a.swatch:"other", amount:map[id]};
  });
  rows.sort(function(a,b){ return b.amount-a.amount; });
  return rows;
}
function last6Months(mk){
  var out=[]; for(var i=5;i>=0;i--) out.push(shiftMonth(mk,-i));
  return out;
}

function periodPnlChartSvg(months, netSeries){
  var w=560, h=180, pad=28;
  var groupW = (w - pad*2) / months.length;
  var barW = Math.min(28, groupW - 18);
  var maxV = Math.max(1, Math.max.apply(null, netSeries.map(Math.abs)));
  var base = h - pad;
  var innerH = h - pad*2;
  var bars = "", pts = [];
  months.forEach(function(m, i){
    var gx = pad + i*groupW + (groupW - barW)/2;
    var v = netSeries[i];
    var barH = Math.max(2, Math.abs(v)/maxV * (innerH/2));
    var y = v>=0 ? base - barH : base;
    bars += '<rect x="'+gx+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="3" fill="'+(v>=0?'var(--income)':'var(--expense)')+'"></rect>';
    var label = m.split("-")[1]+"월";
    bars += '<text x="'+(gx+barW/2)+'" y="'+(h-6)+'" font-size="11" text-anchor="middle" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">'+label+'</text>';
    pts.push([gx+barW/2, v>=0 ? y : y+barH]);
  });
  var pathD = pts.map(function(p,i){ return (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var dots = pts.map(function(p){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--brand)"></circle>'; }).join("");
  bars += '<line x1="'+pad+'" y1="'+base+'" x2="'+(w-pad)+'" y2="'+base+'" stroke="var(--line-strong)" stroke-width="1"></line>';
  bars += '<path d="'+pathD+'" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"></path>'+dots;
  return '<svg class="trend-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="최근 6개월 기간손익">'+bars+'</svg>';
}

function renderHome(){

  var netPct = sum.income>0 ? Math.round((sum.net/sum.income)*100) : 0;
  var debtPct = totalAsset>0 ? Math.round((totalLiability/totalAsset)*100) : 0;

  var html = '<div class="page-head"><div><h1 class="page-title">대시보드</h1><div class="page-desc">'+monthLabel(mk)+'</div></div>'+

function computeRunningBalances(accountId){
  var acc = acctById(accountId); if(!acc) return {};
  var debitNormal = isDebitNormal(acc.cls);
  var bal = acc.initial||0;
  var sorted = state.transactions.filter(function(t){return t.debitId===accountId||t.creditId===accountId;})
    .slice().sort(function(a,b){ return a.date.localeCompare(b.date) || a.createdAt-b.createdAt; });
  var map = {};
  sorted.forEach(function(t){
    if(t.debitId===accountId) bal += debitNormal ? t.amount : -t.amount;
    else if(t.creditId===accountId) bal += debitNormal ? -t.amount : t.amount;
    map[t.id] = bal;
  });
  return map;
}

function ledgerItemName(t, kindId){
  if(t.item) return t.item;
  var debit = acctById(t.debitId), credit = acctById(t.creditId);
  var debitCls = debit?debit.cls:null, creditCls = credit?credit.cls:null;
  if(debitCls==="expense") return debit.name;
  if(creditCls==="income") return credit.name;
  var k = kindId ? kindById(kindId) : null;
  return k ? k.label : "기타 거래";
}

/* 년/분기/최근/기간 필터를 breakdownRange()와 같은 패턴으로 계산 - 분기(quarter)와
   최근(recent) 두 갈래만 breakdownRange에는 없는 거래내역 전용 옵션. */
function quarterRange(y, q){
  var startMonth = (q-1)*3 + 1;
  var endMonth = startMonth + 2;
  var start = y+"-"+pad2(startMonth)+"-01";
  var endMk = y+"-"+pad2(endMonth);
  return { start: start, end: monthEndDate(endMk), label: y+"년 "+q+"분기" };
}
function shiftQuarter(y, q, delta){
  var idx = (parseInt(y,10)*4 + (parseInt(q,10)-1)) + delta;
  var ny = Math.floor(idx/4), nq = (((idx%4)+4)%4)+1;
  return { year: String(ny), quarter: String(nq) };
}
function ledgerRange(){
  if(ui.ledgerPeriodMode==="year"){
    var y = ui.ledgerYear;
    var yr = yearRange(y);
    return { start: yr.start, end: yr.end, label: y+"년" };
  }else if(ui.ledgerPeriodMode==="quarter"){
    return quarterRange(parseInt(ui.ledgerYear,10), parseInt(ui.ledgerQuarter,10));
  }else if(ui.ledgerPeriodMode==="recent"){
    var to = todayIso();
    var d = new Date(); d.setDate(d.getDate()-89);
    var from = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    return { start: from, end: to, label: "최근 3개월" };
  }else if(ui.ledgerPeriodMode==="range"){
    var f = ui.ledgerFrom || todayIso(), t = ui.ledgerTo || todayIso();
    return { start: f, end: t, label: f+" ~ "+t };
  }else{
    var mk = ui.ledgerMonth;
    return { start: mk+"-01", end: monthEndDate(mk), label: monthLabel(mk) };
  }
}
function ledgerAccountOptionsHtml(selectedId){
  var html = '<option value="all"'+(selectedId==="all"?" selected":"")+'>전체</option>';
  ACCT_GROUP_ORDER.forEach(function(g){
    var list = acctsByCls(g.cls);
    if(!list.length) return;
    html += '<optgroup label="'+g.label+'">'+
      list.map(function(a){
        return '<option value="'+a.id+'"'+(selectedId===a.id?" selected":"")+'>'+escapeHtml(a.name)+'</option>';
      }).join("")+
    '</optgroup>';
  });
  return html;
}

function renderLedger(){
  var range = ledgerRange();
  var list = state.transactions.filter(function(t){
    if(t.date < range.start || t.date > range.end) return false;
    var kindId = deriveKind(t.debitId, t.creditId);
    if(ui.ledgerFilter!=="all" && (kindId||"other")!==ui.ledgerFilter) return false;
    // 계정 필터링: 차변과 대변이 같은 경우 어느 쪽이든 해당 계정을 포함하는 거래를 표시
    if(ui.ledgerDebitAccount!=="all" && ui.ledgerCreditAccount!=="all" && ui.ledgerDebitAccount===ui.ledgerCreditAccount){
      // 같은 계정으로 필터링: 차변 OR 대변에 포함
      if(t.debitId!==ui.ledgerDebitAccount && t.creditId!==ui.ledgerDebitAccount) return false;
    }else{
      // 각각 다르게 필터링: 차변 AND 대변 체크
      if(ui.ledgerDebitAccount!=="all" && t.debitId!==ui.ledgerDebitAccount) return false;
      if(ui.ledgerCreditAccount!=="all" && t.creditId!==ui.ledgerCreditAccount) return false;
    }
    if(ui.ledgerItemQuery){
      var itemName = ledgerItemName(t, kindId).toLowerCase();
      if(itemName.indexOf(ui.ledgerItemQuery.trim().toLowerCase())===-1) return false;
    }
    if(ui.ledgerMemoQuery){
      if((t.memo||"").toLowerCase().indexOf(ui.ledgerMemoQuery.trim().toLowerCase())===-1) return false;
    }
    if(ui.ledgerAmountFrom!=="" && ui.ledgerAmountFrom!=null && t.amount < Number(ui.ledgerAmountFrom)) return false;
    if(ui.ledgerAmountTo!=="" && ui.ledgerAmountTo!=null && t.amount > Number(ui.ledgerAmountTo)) return false;
    // 날짜 필터링: 특정 날짜를 선택한 경우 그 날짜만 표시
    if(ui.ledgerSelectedDate!=="" && t.date !== ui.ledgerSelectedDate) return false;
    return true;
  }).sort(function(a,b){ return b.date.localeCompare(a.date) || b.createdAt-a.createdAt; });

  var income=0, expense=0;

  else if(ui.ledgerCreditAccount!=="all" && ui.ledgerDebitAccount==="all") focusAccountId = ui.ledgerCreditAccount;
  else if(ui.ledgerDebitAccount!=="all" && ui.ledgerDebitAccount===ui.ledgerCreditAccount) focusAccountId = ui.ledgerDebitAccount;

    html += '<div class="month-nav">'+

    '<div class="field"><label>메모</label><input type="text" data-action="ledger-memo-input" placeholder="메모 검색" value="'+escapeHtml(ui.ledgerMemoQuery||"")+'"></div>'+

      '<label style="display:block;margin-bottom:0.5rem;">금액</label>'+
      '<div style="display:flex;gap:0.75rem;align-items:center;">'+
        '<input type="number" min="0" step="1" data-action="ledger-amount-input" data-field="from" placeholder="0" value="'+escapeHtml(ui.ledgerAmountFrom||"")+'" style="flex:1;min-width:0;">'+
        '<span style="flex-shrink:0;font-weight:500;color:var(--text-secondary);">~</span>'+
        '<input type="number" min="0" step="1" data-action="ledger-amount-input" data-field="to" placeholder="제한 없음" value="'+escapeHtml(ui.ledgerAmountTo||"")+'" style="flex:1;min-width:0;">'+

    '<div class="chiprow" style="margin-bottom:0;">'+
      [["all","전체"],["expense","지출"],["income","수입"],["cardExpense","카드지출"],["transfer","이체"],["debtPay","부채상환"],["borrow","차입"],["other","기타"]].map(function(f){
        return '<button class="chip" data-action="ledger-filter" data-val="'+f[0]+'" aria-pressed="'+(ui.ledgerFilter===f[0])+'">'+f[1]+'</button>';

  html += '</div>';

  if(list.length===0){
    html += '<div class="card">'+emptyState("조건에 맞는 내역이 없어요","필터를 조정하거나 새 거래를 입력해보세요.")+'</div>';
  }else{
    html += '<div class="ledger-table-wrap desktop-only"><table class="ledger-table">'+

      '<tbody>'+list.map(function(t){ return ledgerTableRowHtml(t, runningMap); }).join("")+'</tbody>'+
    '</table></div>';

    var groups = {}; var order = [];

        if(k==="income") dayIncome+=t.amount;

      });
      var totalStr = [];
      if(dayIncome) totalStr.push('<span class="num" style="color:var(--income);">+'+fmtWon(dayIncome)+'</span>');
      if(dayExpense) totalStr.push('<span class="num" style="color:var(--expense);">-'+fmtWon(dayExpense)+'</span>');
      return '<div class="day-group"><div class="day-head"><span data-action="filter-by-date" data-date="'+date+'" style="cursor:pointer;text-decoration:underline;color:var(--link);">'+fmtDateShort(date)+'</span><span class="d-total">'+totalStr.join(" · ")+'</span></div>'+
        items.map(function(t){ return txRowHtml(t, {actions:true}); }).join("")+'</div>';
    }).join("")+'</div>';
  }

  // 선택된 거래들의 합계 계산
  var selectedAmount = 0, selectedCount = 0;
  Object.keys(ui.ledgerSelectedTxIds).forEach(function(txId){
    var t = state.transactions.find(function(tx){ return tx.id === txId; });
    if(t && list.indexOf(t) !== -1){

      selectedCount++;

  if(selectedCount > 0){
    html += '<div class="selection-bar" style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.08);border-top:1px solid var(--line);padding:12px 16px;text-align:center;font-size:0.9rem;z-index:100;">'+

    '</div>';
  }

  document.getElementById("main").innerHTML = html;
}

  html += '<div class="trend-legend"><span class="legend-dot"><i style="background:var(--income);"></i>수입</span><span class="legend-dot"><i style="background:var(--expense);"></i>지출</span></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-head"><span class="card-title">카테고리별 지출</span></div>';

    html += emptyState("지출 내역이 없어요","이 달에 기록된 지출이 아직 없어요.");
  }else{
    var total = breakdown.reduce(function(a,r){return a+r.amount;},0);

  var budgetCats = state.accounts.filter(function(a){ return a.cls==="expense" && state.budgets[a.id]>0; });
  if(budgetCats.length===0){
    html += emptyState("설정된 예산이 없어요","설정 탭에서 카테고리별 예산을 정해보세요.");
  }else{
    html += budgetCats.map(function(c){
      var spent = breakdown.find(function(r){return r.id===c.id;});
      spent = spent ? spent.amount : 0;
      var limit = state.budgets[c.id];
      var pct = Math.min(100, Math.round((spent/limit)*100));
      var status = spent>limit ? "critical" : pct>=80 ? "warning" : "good";
      var statusLabel = status==="critical"?"초과":status==="warning"?"주의":"양호";
      return '<div class="budget-row"><div class="budget-top"><span><span class="swatch" style="background:'+swatchVar(c.swatch)+';margin-right:6px;"></span>'+escapeHtml(c.name)+'</span>'+
        '<span class="status-pill '+status+'">'+statusLabel+'</span></div>'+
        '<div class="budget-track"><div class="budget-fill" style="width:'+pct+'%;background:var(--'+status+');"></div></div>'+
        '<div class="faint num" style="font-size:0.78rem;margin-top:6px;">'+fmtWon(spent)+' / '+fmtWon(limit)+'</div>'+
      '</div>';
    }).join("");
  }
  html += '</div>';

  document.getElementById("main").innerHTML = html;
}

function trendChartSvg(months, series, maxV){
  var w=560, h=180, pad=28, gap=18;
  var groupW = (w - pad*2) / months.length;
  var barW = Math.min(20, (groupW - gap) / 2);
  var bars = "";
  months.forEach(function(m, i){
    var gx = pad + i*groupW + (groupW - (barW*2+4))/2;
    var incH = (series[i].income/maxV) * (h - pad*2);
    var expH = (series[i].expense/maxV) * (h - pad*2);
    var base = h - pad;
    bars += '<rect x="'+gx+'" y="'+(base-incH)+'" width="'+barW+'" height="'+Math.max(incH,1)+'" rx="3" fill="var(--income)"></rect>';
    bars += '<rect x="'+(gx+barW+4)+'" y="'+(base-expH)+'" width="'+barW+'" height="'+Math.max(expH,1)+'" rx="3" fill="var(--expense)"></rect>';
    var label = m.split("-")[1]+"월";
    bars += '<text x="'+(gx+barW+2)+'" y="'+(h-6)+'" font-size="11" text-anchor="middle" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">'+label+'</text>';
  });
  bars += '<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="var(--line-strong)" stroke-width="1"></line>';
  return '<svg class="trend-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="최근 6개월 수입 지출 추이">'+bars+'</svg>';
}

function netWorthChartSvg(months, nwSeries, nwMax){
  var w=560, h=150, pad=28;
  var innerW = w - pad*2, innerH = h - pad*2;
  var stepX = innerW / (months.length-1 || 1);
  var midY = pad + innerH/2;
  var pts = nwSeries.map(function(v, i){
    var x = pad + i*stepX;
    var y = midY - (v/nwMax) * (innerH/2);
    return [x,y];
  });
  var pathD = pts.map(function(p,i){ return (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var areaD = pathD + " L"+pts[pts.length-1][0].toFixed(1)+","+midY+" L"+pts[0][0].toFixed(1)+","+midY+" Z";
  var dots = pts.map(function(p,i){
    var isLast = i===pts.length-1;
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(isLast?4:2.5)+'" fill="var(--brand)"></circle>';
  }).join("");
  var labels = months.map(function(m,i){
    return '<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-6)+'" font-size="11" text-anchor="middle" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">'+m.split("-")[1]+'월</text>';
  }).join("");
  return '<svg class="trend-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="최근 6개월 순자산 추이">'+
    '<line x1="'+pad+'" y1="'+midY+'" x2="'+(w-pad)+'" y2="'+midY+'" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3,3"></line>'+
    '<path d="'+areaD+'" fill="var(--brand)" opacity="0.12" stroke="none"></path>'+
    '<path d="'+pathD+'" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>'+
    dots + labels +
  '</svg>';
}

/* ================= render: breakdown (비용·수익) ================= */
function yearRange(y){
  return { start: y+"-01-01", end: y+"-12-31" };
}
function breakdownRange(){
  if(ui.breakdownMode==="year"){
    var y = ui.breakdownYear;
    var yr = yearRange(y);
    return { start: yr.start, end: yr.end, label: y+"년" };
  }else if(ui.breakdownMode==="range"){
    var from = ui.breakdownFrom || todayIso(), to = ui.breakdownTo || todayIso();
    return { start: from, end: to, label: from+" ~ "+to };
  }else{
    var mk = ui.breakdownMonth;
    return { start: mk+"-01", end: monthEndDate(mk), label: monthLabel(mk) };
  }
}
/* Groups a class's transactions in [start,end] by account group (mirroring
   groupedAccts' ungrouped-first-then-groups ordering), so breakdownGroupHtml can
   render each group as a collapsible section with a % bar, and barListHtml can
   render the individual accounts inside. */
function rangeGroupedBreakdown(start, end, cls){
  var acctAmt = {};
  state.transactions.forEach(function(t){
    if(t.date < start || t.date > end) return;
    if(cls==="expense" && clsOf(t.debitId)==="expense"){
      acctAmt[t.debitId] = (acctAmt[t.debitId]||0) + t.amount;
    }else if(cls==="income" && clsOf(t.creditId)==="income"){
      acctAmt[t.creditId] = (acctAmt[t.creditId]||0) + t.amount;
    }
  });
  var total = 0;
  Object.keys(acctAmt).forEach(function(id){ total += acctAmt[id]; });
  var grouped = groupedAccts(cls);
  var sections = [];
  var ungroupedItems = grouped.ungrouped
    .filter(function(a){ return acctAmt[a.id]>0; })
    .map(function(a){ return {name:a.name, swatch:a.swatch, amount:acctAmt[a.id], expenseType:a.expenseType}; });
  if(ungroupedItems.length){
    sections.push({id:"ungrouped", name:"미분류", amount: ungroupedItems.reduce(function(s,r){return s+r.amount;},0), items: ungroupedItems});
  }
  grouped.groups.forEach(function(g){
    var items = g.items.filter(function(a){ return acctAmt[a.id]>0; }).map(function(a){ return {name:a.name, swatch:a.swatch, amount:acctAmt[a.id], expenseType:a.expenseType}; });
    if(items.length){
      sections.push({id:g.group.id, name:g.group.name, amount: items.reduce(function(s,r){return s+r.amount;},0), items:items});
    }
  });
  sections.sort(function(a,b){ return b.amount-a.amount; });
  return {total:total, sections:sections};
}
function renderBreakdown(){
  var range = breakdownRange();
  var exp = rangeGroupedBreakdown(range.start, range.end, "expense");
  var inc = rangeGroupedBreakdown(range.start, range.end, "income");
  var net = inc.total - exp.total;

  var html = '<div class="page-head"><h1 class="page-title">비용·수익</h1><div class="page-desc">기간을 골라 비용과 수익을 그룹별로 살펴보기</div></div>';

  html += '<div class="period-bar">';
  html += '<div class="seg">'+["month","year","range"].map(function(m){
      var lbl = m==="month"?"월":m==="year"?"년":"기간";
      return '<button type="button" class="seg-btn" data-action="breakdown-mode" data-val="'+m+'" aria-pressed="'+(ui.breakdownMode===m)+'">'+lbl+'</button>';
    }).join("")+'</div>';

  if(ui.breakdownMode==="range"){
    html += '<div class="range-inputs">'+
      '<input type="date" data-action="breakdown-range-input" data-field="from" value="'+(ui.breakdownFrom||"")+'">'+
      '<span class="faint">~</span>'+
      '<input type="date" data-action="breakdown-range-input" data-field="to" value="'+(ui.breakdownTo||"")+'">'+
    '</div>';
  }else{
    html += '<div class="month-nav">'+
      '<button class="btn btn-icon" data-action="breakdown-period" data-delta="-1" aria-label="이전">'+ICONS.chevL+'</button>'+
      '<span class="month-label">'+range.label+'</span>'+
      '<button class="btn btn-icon" data-action="breakdown-period" data-delta="1" aria-label="다음">'+ICONS.chev+'</button>'+
    '</div>';
  }
  html += '</div>';

  html += '<div class="breakdown-grid">'+
    breakdownPanelHtml("expense", "비용", exp)+
    breakdownPanelHtml("income", "수익", inc)+
  '</div>';

  html += '<div class="grid-stats">'+
    '<div class="stat-card"><div class="stat-label">당기순이익</div><div class="stat-value num" style="color:'+(net>=0?'var(--good)':'var(--expense)')+';">'+fmtWon(net)+'</div></div>'+
  '</div>';

  document.getElementById("main").innerHTML = html;
}
function breakdownPanelHtml(cls, label, data){
  var html = '<div class="card breakdown-panel">'+
    '<div class="card-head"><span class="card-title">'+label+'</span><span class="breakdown-total num" style="color:var(--'+cls+');">'+fmtWon(data.total)+'</span></div>';
  if(data.sections.length===0){
    html += emptyState((cls==="expense"?"지출":"수입")+" 내역이 없어요","선택한 기간에 기록된 내역이 아직 없어요.");
  }else{
    html += '<div class="bd-total-row"><span class="barlist-track" style="flex:1;"><span class="barlist-fill" style="width:100%;background:var(--'+cls+');"></span></span><span class="bd-group-pct faint">100%</span></div>';
    html += data.sections.map(function(sec){ return breakdownGroupHtml(cls, sec, data.total); }).join("");
  }
  html += '</div>';
  return html;
}
function breakdownGroupHtml(cls, sec, total){
  var collapsed = !!ui.breakdownCollapsed[sec.id];
  var pct = total>0 ? Math.round((sec.amount/total)*100) : 0;
  var barW = pct>0 ? Math.max(2,Math.min(100,pct)) : 0;
  var html = '<div class="bd-group">';
  html += '<button type="button" class="bd-group-head" data-action="toggle-breakdown-group" data-id="'+sec.id+'" aria-expanded="'+(!collapsed)+'">'+
    '<span class="bd-chev'+(collapsed?" collapsed":"")+'">'+ICONS.chev+'</span>'+
    '<span class="bd-group-name">'+escapeHtml(sec.name)+'</span>'+
    '<span class="barlist-track bd-inline-track"><span class="barlist-fill" style="width:'+barW+'%;background:var(--'+cls+');"></span></span>'+
    '<span class="bd-group-pct faint">'+pct+'%</span>'+
    '<span class="bd-group-amt num">'+fmtWon(sec.amount)+'</span>'+
  '</button>';
  if(!collapsed){
    html += '<div class="bd-items">'+barListHtml(sec.items, total||1, cls)+'</div>';
  }
  html += '</div>';
  return html;
}

/* ================= render: accounts ================= */
/* Inline row controls (move up/down, optionally edit, delete) shown directly on
   every account/category row and group header - so those actions work in one
   tap without opening the full edit modal, matching the reference app's
   move/edit/delete row icons. editAction is omitted for account rows, since
   the whole row already opens the edit modal on click. */
function rowControlsHtml(cls, groupId, itemId, isFirst, isLast, deleteAction, editAction){
  var editBtn = editAction ? '<button class="icon-btn sm" data-action="'+editAction+'" data-cls="'+cls+'" data-id="'+itemId+'" aria-label="수정">'+ICONS.edit+'</button>' : '';
  return '<div class="row-controls">'+
    '<button class="icon-btn sm" data-action="move-item" data-cls="'+cls+'" data-group-id="'+(groupId||"")+'" data-id="'+itemId+'" data-dir="up" '+(isFirst?"disabled":"")+' aria-label="위로 이동">'+ICONS.up+'</button>'+
    '<button class="icon-btn sm" data-action="move-item" data-cls="'+cls+'" data-group-id="'+(groupId||"")+'" data-id="'+itemId+'" data-dir="down" '+(isLast?"disabled":"")+' aria-label="아래로 이동">'+ICONS.down+'</button>'+
    editBtn+
    '<button class="icon-btn sm" data-action="'+deleteAction+'" data-id="'+itemId+'" aria-label="삭제">'+ICONS.trash+'</button>'+
  '</div>';
}
function dragHandleHtml(kind, cls, id){
  return '<span class="drag-handle" aria-hidden="true" style="display:none;"></span>';
}
function groupHeadHtml(cls, g, itemCount, isFirst, isLast){
  var collapsed = !!ui.settingsCollapsed[g.id];
  return '<button type="button" class="bd-group-head" data-action="toggle-group" data-cls="'+cls+'" data-group-id="'+g.id+'" data-id="'+g.id+'" aria-expanded="'+(!collapsed)+'">'+
    '<span class="bd-chev'+(collapsed?" collapsed":"")+'">'+ICONS.chev+'</span>'+
    '<span class="group-name" data-cls="'+cls+'" data-id="'+g.id+'">'+escapeHtml(g.name)+' <span class="group-count">'+itemCount+'개</span></span>'+
    '<div class="row-controls" data-stop="1">'+
      '<button class="icon-btn sm" data-action="move-group" data-cls="'+cls+'" data-id="'+g.id+'" data-dir="up" '+(isFirst?"disabled":"")+' aria-label="위로 이동">'+ICONS.up+'</button>'+
      '<button class="icon-btn sm" data-action="move-group" data-cls="'+cls+'" data-id="'+g.id+'" data-dir="down" '+(isLast?"disabled":"")+' aria-label="아래로 이동">'+ICONS.down+'</button>'+
      '<button class="icon-btn sm" data-action="open-group" data-id="'+g.id+'" aria-label="그룹 수정">'+ICONS.edit+'</button>'+
      '<button class="icon-btn sm" data-action="delete-group" data-id="'+g.id+'" aria-label="그룹 삭제">'+ICONS.trash+'</button>'+
    '</div>'+
  '</button>';

/* Renders a class's items nested under group headers: ungrouped items first
   (no header, so single-account setups look exactly as before), then each
   group in definition order - including empty groups, so a freshly-created
   group is visible and editable before anything is filed under it. rowFn
   receives (item, ctx) where ctx carries the item's position within its
   CURRENT list (ungrouped, or a specific group) so move up/down can disable
   at the ends. */
function groupedListHtml(cls, rowFn){
  var g = groupedAccts(cls);
  var html = '<div data-settings-container="'+cls+'" style="display:block;width:100%;overflow:visible;min-height:auto;">';

  // ungrouped items 먼저
  g.ungrouped.forEach(function(item, idx){
    html += rowFn(item, {cls:cls, groupId:null, isFirst: idx===0, isLast: idx===g.ungrouped.length-1});
  });

  // 각 그룹을 평면 리스트로 표시 (후잉가계부 스타일)
  g.groups.forEach(function(x, gi){
    var isFirstGroup = gi===0, isLastGroup = gi===g.groups.length-1;
    var collapsed = !!ui.settingsCollapsed[x.group.id];

    // 그룹 헤더를 평면 항목으로 표시
    html += '<div class="settings-item group-header" data-id="'+x.group.id+'" data-type="group" data-cls="'+cls+'" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px 8px 36px;margin-bottom:0;background:none;border-radius:0;border:none;border-bottom:1px solid var(--line);font-size:0.9rem;overflow:visible;cursor:move;">';

    html += '<span class="group-drag-handle" style="display:none;"></span>';
    html += '<span class="group-name" style="flex:1;font-weight:800;font-size:1.05rem;">'+escapeHtml(x.group.name)+' <span style="color:var(--ink-faint);font-weight:400;font-size:0.85rem;">'+x.items.length+'개</span></span>';

    // 그룹 컨트롤
    html += '<div class="row-controls" style="display:flex;align-items:center;gap:1px;flex:none;margin-left:auto;">';
    html += '<button class="icon-btn sm" data-action="move-group" data-cls="'+cls+'" data-id="'+x.group.id+'" data-dir="up" '+(isFirstGroup?"disabled":"")+' aria-label="위로 이동">'+ICONS.up+'</button>';
    html += '<button class="icon-btn sm" data-action="move-group" data-cls="'+cls+'" data-id="'+x.group.id+'" data-dir="down" '+(isLastGroup?"disabled":"")+' aria-label="아래로 이동">'+ICONS.down+'</button>';
    html += '<button class="icon-btn sm" data-action="open-group" data-id="'+x.group.id+'" aria-label="그룹 수정">'+ICONS.edit+'</button>';
    html += '<button class="icon-btn sm" data-action="delete-group" data-id="'+x.group.id+'" aria-label="그룹 삭제">'+ICONS.trash+'</button>';
    html += '</div>';
    html += '</div>';

    // 그룹 아래 항목들을 평면 리스트로
    if(x.items.length){
      x.items.forEach(function(item, idx){
        var itemHtml = rowFn(item, {cls:cls, groupId:x.group.id, isFirst: idx===0, isLast: idx===x.items.length-1});
        // rowFn이 반환한 HTML의 .catrow를 .settings-item으로 변환

/* Percentage-of-total, huing-style bar row for a single account: left-aligned
   dot+name, an inline proportional bar, then pct+balance - same language as
   barListHtml's item rows in the 비용수익 tab. Read-only: editing an account
   now happens from 설정, so this row carries no click/edit affordance. */
function acctItemBarRowHtml(a, ctx, clsTotal, color){
  var bal = accountBalance(a.id);
  var pct = clsTotal ? Math.round((bal/clsTotal)*100) : 0;
  var barW = pct>0 ? Math.max(2,Math.min(100,pct)) : 0;
  var balColor = ctx.cls==="liability" ? (bal>0?'var(--expense)':'var(--ink)') : 'var(--ink)';
  var iconHtml = ctx.cls==="liability" ? '<span style="display:flex;align-items:center;color:var(--expense);width:16px;height:16px;flex:none;">'+ICONS.card+'</span>' : '';
  return '<div class="acct-row">'+
    '<div class="acct-left">'+
    iconHtml+
    '<span class="acct-name">'+escapeHtml(a.name)+'</span></div>'+
    '<span class="barlist-track bd-inline-track"><span class="barlist-fill" style="width:'+barW+'%;background:'+color+';"></span></span>'+
    '<div class="acct-right"><span class="bd-group-pct faint">'+pct+'%</span>'+
    '<span class="acct-balance num" style="color:'+balColor+';">'+fmtWon(bal)+'</span>'+
    '</div>'+
  '</div>';

/* Collapsible group block for the accounts tab, read-only - same
   chevron+inline-bar language and markup as breakdownGroupHtml so 자산·부채
   and 비용·수익 now look and behave the same way (only 설정 edits either). */
function acctGroupBarHtml(cls, g, items, clsTotal, isFirstGroup, isLastGroup, color){
  var collapsed = !!ui.acctsCollapsed[g.id];

function openModal(html, opts){

      '<div class="modal-panel'+(wide?" wide":"")+'" data-stop="1">'+html+'</div>'+

function initTabSwitching(){
  var tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      var tabName = btn.getAttribute('data-tab');

      // 버튼 스타일 변경
      tabBtns.forEach(function(b){
        b.classList.remove('active');
        b.style.borderBottom = '3px solid transparent';
        b.style.color = 'var(--ink-faint)';
      });
      btn.classList.add('active');
      btn.style.borderBottom = '3px solid var(--brand)';
      btn.style.color = 'var(--ink)';

      // 탭 컨텐츠 변경
      var panes = document.querySelectorAll('.tab-pane');
      panes.forEach(function(pane){
        pane.classList.remove('active');
        pane.style.display = 'none';
      });
      var activePane = document.querySelector('[data-tab-pane="' + tabName + '"]');
      if(activePane){
        activePane.classList.add('active');
        activePane.style.display = 'block';
      }
    });
  });
}

  pendingConfirm = onYes;

      '<button type="button" class="btn btn-danger" data-action="confirm-yes">삭제</button>'+
    '</div>';
  openModal(html);
}

function groupModalHtml(cls, editing){
  var g = editing || {name:"", cls:cls};

  var html = '<div class="modal-head"><span class="modal-title">'+(isEdit?"그룹 수정":label+" 그룹 추가")+'</span>'+
    '<button class="icon-btn" data-action="close-modal" aria-label="닫기">'+ICONS.close+'</button></div>';
  html += '<form data-form="group" data-cls="'+cls+'" data-id="'+(isEdit?g.id:"")+'">';
  html += '<div class="field"><label>그룹 이름</label><input type="text" name="name" value="'+escapeHtml(g.name)+'" required placeholder="예: 입출금, 신용카드"></div>';

  html += '</div></form>';
  return html;
}

/* ================= event handling ================= */
document.addEventListener("click", function(e){
  var overlay = e.target.closest && e.target.closest(".modal-overlay");
  if(overlay && !e.target.closest("[data-stop]")){ closeModal(); return; }

  var el = e.target.closest && e.target.closest("[data-action]");
  var stopBoundary = e.target.closest && e.target.closest("[data-stop]");
  if(el && stopBoundary && !stopBoundary.contains(el)){ el = null; }
  if(!el) return;
  var action = el.getAttribute("data-action");

  if(action==="tab"){
    ui.tab = el.getAttribute("data-tab"); saveUi(); render();
  }else if(action==="close-modal"){
    closeModal();
  }else if(action==="toggle-tx-select"){
    var txId = el.getAttribute("data-id");
    if(ui.ledgerSelectedTxIds[txId]){
      delete ui.ledgerSelectedTxIds[txId];
    }else{
      ui.ledgerSelectedTxIds[txId] = true;
    }
    renderLedger();
  }else if(action==="filter-by-item"){
    var itemName = el.getAttribute("data-item");
    ui.ledgerItemQuery = itemName;
    saveUi();
    renderLedger();
  }else if(action==="filter-by-acct"){
    var acctId = el.getAttribute("data-acct");
    // 계정을 클릭하면 그 계정이 차변이든 대변이든 포함되는 모든 거래를 표시
    if(ui.ledgerDebitAccount===acctId && ui.ledgerCreditAccount===acctId){
      // 이미 필터링 중이면 필터 해제
      ui.ledgerDebitAccount = "all";
      ui.ledgerCreditAccount = "all";
    }else{
      // 해당 계정으로 필터링 (차변 OR 대변)
      ui.ledgerDebitAccount = acctId;
      ui.ledgerCreditAccount = acctId;
    }
    saveUi();
    renderLedger();
  }else if(action==="filter-by-date"){
    var date = el.getAttribute("data-date");
    if(ui.ledgerSelectedDate === date){
      // 이미 필터링 중이면 필터 해제
      ui.ledgerSelectedDate = "";
    }else{
      // 해당 날짜로 필터링
      ui.ledgerSelectedDate = date;
    }
    saveUi();
    renderLedger();
  }else if(action==="open-tx"){
    var id = el.getAttribute("data-id");
    var tx = id ? state.transactions.find(function(t){return t.id===id;}) : null;
    openModal(txModalHtml(tx ? txFromRecord(tx) : null), {wide:true});
  }else if(action==="pick-side"){
    var side = el.getAttribute("data-side");
    var val = el.getAttribute("data-val");
    var form2 = el.closest("form");
    form2.querySelector('input[name="'+side+'Id"]').value = val;
    form2.querySelectorAll('.catpick[data-action="pick-side"][data-side="'+side+'"]').forEach(function(b){ b.setAttribute("aria-pressed", b===el); });
    var pillEl = form2.querySelector('[data-pill="'+side+'"]');
    if(pillEl){ var a = acctById(val); pillEl.textContent = a ? a.name : "계정을 선택하세요"; }
  }else if(action==="dashboard-refresh"){
    render(); toast("새로고침 했어요.");
  }else if(action==="delete-tx"){
    var did = el.getAttribute("data-id");
    openConfirmModal("이 내역을 삭제할까요?", function(){
      commit(function(s){ s.transactions = s.transactions.filter(function(t){return t.id!==did;}); return s; });
    });
  }else if(action==="duplicate-tx"){
    var srcId = el.getAttribute("data-id");
    var src = state.transactions.find(function(t){return t.id===srcId;});
    if(src){
      openModal(txModalHtml({date: todayIso(), amount:src.amount, memo:src.memo, item:src.item, debitId:src.debitId, creditId:src.creditId}), {wide:true});
    }
  }else if(action==="confirm-yes"){
    var cb = pendingConfirm; pendingConfirm = null;
    closeModal();
    if(cb) cb();
  }else if(action==="open-add-modal"){
    var cls = el.getAttribute("data-cls") || "asset";
    openModal(addItemOrGroupModalHtml(cls));
    setTimeout(function(){ initTabSwitching(); }, 0);
  }else if(action==="open-account"){
    var aid = el.getAttribute("data-id");
    var acc = aid ? acctById(aid) : null;
    var cls = acc ? acc.cls : (el.getAttribute("data-cls") || "asset");
    openModal(accountModalHtml(cls, acc));
  }else if(action==="delete-account"){
    var aid2 = el.getAttribute("data-id");
    var used = state.transactions.some(function(t){ return t.debitId===aid2 || t.creditId===aid2; });
    var msg = used ? "이 계정을 사용한 내역이 있어요. 그래도 삭제할까요?" : "이 계정을 삭제할까요?";
    openConfirmModal(msg, function(){
      commit(function(s){
        s.accounts = s.accounts.filter(function(a){return a.id!==aid2;});
        delete s.budgets[aid2];
        return s;
      });
    });
  }else if(action==="open-category"){
    var ccls = el.getAttribute("data-cls");
    var cid = el.getAttribute("data-id");
    var cat = cid ? acctById(cid) : null;
    openModal(categoryModalHtml(ccls, cat));
  }else if(action==="open-group"){
    var gid = el.getAttribute("data-id");
    var grp = gid ? groupById(gid) : null;
    var gcls = grp ? grp.cls : (el.getAttribute("data-cls") || "asset");
    openModal(groupModalHtml(gcls, grp));
  }else if(action==="move-group"){
    moveGroup(el.getAttribute("data-cls"), el.getAttribute("data-id"), el.getAttribute("data-dir"));
  }else if(action==="move-item"){
    var miGroupId = el.getAttribute("data-group-id") || null;
    moveItem(el.getAttribute("data-cls"), miGroupId, el.getAttribute("data-id"), el.getAttribute("data-dir"));
  }else if(action==="delete-group"){
    var gid2 = el.getAttribute("data-id");
    var used2 = state.accounts.some(function(a){ return a.groupId===gid2; });
    var gmsg = used2 ? "이 그룹에 속한 항목이 있어요. 그룹을 삭제하면 항목들은 '그룹 없음'으로 남아요. 삭제할까요?" : "이 그룹을 삭제할까요?";
    openConfirmModal(gmsg, function(){
      commit(function(s){
        s.groups = s.groups.filter(function(g){ return g.id!==gid2; });
        s.accounts = s.accounts.map(function(a){ return a.groupId===gid2 ? Object.assign({}, a, {groupId:null}) : a; });
        return s;
      });
    });
  }else if(action==="cat-swatch"){
    var form3 = el.closest("form");
    form3.querySelector('input[name="swatch"]').value = el.getAttribute("data-val");
    form3.querySelectorAll('.catpick[data-action="cat-swatch"]').forEach(function(b){ b.setAttribute("aria-pressed", b===el); });
  }else if(action==="stats-month"){
    ui.statsMonth = shiftMonth(ui.statsMonth, parseInt(el.getAttribute("data-delta"),10));
    saveUi(); render();
  }else if(action==="ledger-filter"){
    ui.ledgerFilter = el.getAttribute("data-val"); saveUi(); render();
  }else if(action==="ledger-period-mode"){
    ui.ledgerPeriodMode = el.getAttribute("data-val"); saveUi(); render();
  }else if(action==="ledger-period-nav"){
    var lDelta = parseInt(el.getAttribute("data-delta"),10);
    if(ui.ledgerPeriodMode==="year"){
      ui.ledgerYear = String(parseInt(ui.ledgerYear,10) + lDelta);
    }else if(ui.ledgerPeriodMode==="quarter"){
      var shifted = shiftQuarter(parseInt(ui.ledgerYear,10), parseInt(ui.ledgerQuarter,10), lDelta);
      ui.ledgerYear = shifted.year; ui.ledgerQuarter = shifted.quarter;
    }else{
      ui.ledgerMonth = shiftMonth(ui.ledgerMonth, lDelta);
    }
    saveUi(); render();
  }else if(action==="ledger-reset"){
    ui.ledgerFilter = "all";
    ui.ledgerDebitAccount = "all"; ui.ledgerCreditAccount = "all";
    ui.ledgerItemQuery = ""; ui.ledgerMemoQuery = "";
    ui.ledgerAmountFrom = ""; ui.ledgerAmountTo = "";
    ui.ledgerSelectedDate = "";
    saveUi(); render();
  }else if(action==="breakdown-mode"){
    ui.breakdownMode = el.getAttribute("data-val"); saveUi(); render();
  }else if(action==="breakdown-period"){
    var bDelta = parseInt(el.getAttribute("data-delta"),10);
    if(ui.breakdownMode==="year"){
      ui.breakdownYear = String(parseInt(ui.breakdownYear,10) + bDelta);
    }else{
      ui.breakdownMonth = shiftMonth(ui.breakdownMonth, bDelta);
    }
    saveUi(); render();
  }else if(action==="toggle-breakdown-group"){
    var secId = el.getAttribute("data-id");
    ui.breakdownCollapsed[secId] = !ui.breakdownCollapsed[secId];
    render();
  }else if(action==="toggle-acct-group"){
    var acctGroupId = el.getAttribute("data-id");
    ui.acctsCollapsed[acctGroupId] = !ui.acctsCollapsed[acctGroupId];
    render();
  }else if(action==="toggle-group"){
    var groupId = el.getAttribute("data-id");
    ui.settingsCollapsed[groupId] = !ui.settingsCollapsed[groupId];
    render();
  }else if(action==="export-csv"){
    exportCsv();
  }else if(action==="reset-data"){
    openConfirmModal("모든 데이터를 초기화할까요? 이 작업은 되돌릴 수 없어요.", function(){
      commit(function(){ return defaultState(); });
    });
  }else if(action==="add-session"){
    var name = prompt("새 가계부 이름을 입력하세요:", "새 가계부");
    if(name && name.trim()){
      addSession(name.trim());
    }
  }else if(action==="rename-session"){
    var current = currentSession();
    var newName = prompt("가계부 이름을 변경하세요:", current.name);
    if(newName && newName.trim() && newName !== current.name){
      renameSession(ui.activeSessionId, newName.trim());
    }
  }else if(action==="duplicate-session"){
    var sessionIdToDup = ui.activeSessionId;
    var modalHtml = '<div style="padding:16px;"><div style="margin-bottom:16px;"><h3 style="margin:0 0 12px 0;">어떻게 복사할까요?</h3>';
    modalHtml += '<p style="margin:0 0 16px 0;color:var(--ink-soft);font-size:0.9rem;">어떤 내용을 포함해서 복사할지 선택하세요.</p>';
    modalHtml += '<div style="display:flex;gap:8px;flex-direction:column;">';
    modalHtml += '<button class="btn btn-primary" data-action="do-duplicate" data-mode="settings" data-session-id="'+sessionIdToDup+'" style="text-align:left;"><strong>⚙️ 설정만 복사</strong><br><span style="font-size:0.8rem;color:var(--ink-faint);">계정·그룹·예산을 복사하고 거래내역은 새로 시작</span></button>';
    modalHtml += '<button class="btn btn-secondary" data-action="do-duplicate" data-mode="full" data-session-id="'+sessionIdToDup+'" style="text-align:left;"><strong>📋 전체 복사</strong><br><span style="font-size:0.8rem;color:var(--ink-faint);">모든 내용을 그대로 복사 (계정·예산·거래내역)</span></button>';
    modalHtml += '</div></div>';
    openModal(modalHtml);
  }else if(action==="delete-session"){
    if(Object.keys(state.sessions).length <= 1){
      alert("최소 1개의 가계부는 유지해야 합니다");
    }else{
      openConfirmModal("이 가계부를 삭제할까요? 이 작업은 되돌릴 수 없어요.", function(){
        deleteSession(ui.activeSessionId);
      });
    }
  }else if(action==="do-duplicate"){
    var mode = el.getAttribute("data-mode");
    var sidToDup = el.getAttribute("data-session-id");
    closeModal();
    duplicateSession(sidToDup, mode);
  }
});
