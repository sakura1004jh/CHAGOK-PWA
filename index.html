});

/* 아이템/메모/금액 검색은 렌더가 DOM을 통째로 다시 그리므로, re-render 전에 caret 위치를
   저장했다가 같은 data-action 셀렉터로 새 엘리먼트를 다시 찾아 포커스·커서를 복원한다. */
function liveFilterInput(el, selStart, selEnd, selector){
  saveUi(); render();
  var again = document.querySelector(selector);
  if(again){ again.focus(); try{ again.setSelectionRange(selStart, selEnd); }catch(err){} }
}
document.addEventListener("input", function(e){
  var t = e.target;
  if(!t.matches) return;
  if(t.matches('[data-action="ledger-item-input"]')){
    ui.ledgerItemQuery = t.value;
    liveFilterInput(t, t.selectionStart, t.selectionEnd, '[data-action="ledger-item-input"]');
  }else if(t.matches('[data-action="ledger-memo-input"]')){
    ui.ledgerMemoQuery = t.value;
    liveFilterInput(t, t.selectionStart, t.selectionEnd, '[data-action="ledger-memo-input"]');
  }else if(t.matches('[data-action="ledger-amount-input"]')){
    var af = t.getAttribute("data-field");
    if(af==="from") ui.ledgerAmountFrom = t.value; else ui.ledgerAmountTo = t.value;
    var sel = '[data-action="ledger-amount-input"][data-field="'+af+'"]';
    liveFilterInput(t, t.selectionStart, t.selectionEnd, sel);
  }
});

document.addEventListener("submit", function(e){
  var form = e.target;
  if(!form.matches("[data-form]")) return;
  e.preventDefault();
  var kind = form.getAttribute("data-form");
  var fd = new FormData(form);

  if(kind==="tx"){
    var id = form.getAttribute("data-id");
    if(!id || id==="undefined") id = null;
    var amount = Math.round(Number(fd.get("amount")) || 0);
    if(amount<=0){ toast("금액을 입력해 주세요."); return; }
    var date = fd.get("date");
    var memo = (fd.get("memo")||"").trim();
    var item = (fd.get("item")||"").trim();
    var debitId = fd.get("debitId");
    var creditId = fd.get("creditId");

    if(!debitId || !creditId){ toast("왼쪽과 오른쪽 계정을 모두 선택해 주세요."); return; }
    if(debitId===creditId){ toast("서로 다른 계정을 선택해 주세요."); return; }

    /* Preserve the original createdAt on an edit - it's the same-day sort
       tiebreaker (see the .sort() calls above), so resetting it here would
       silently reshuffle same-day rows every time one of them is edited. */
    var existingTx = id ? state.transactions.find(function(t){ return t.id===id; }) : null;
    var payload = {id:id||uid(), date:date, debitId:debitId, creditId:creditId, amount:amount, memo:memo, item:item, createdAt: existingTx ? existingTx.createdAt : Date.now()};
    commit(function(s){
      if(id){ s.transactions = s.transactions.map(function(t){ return t.id===id ? payload : t; }); }
      else{ s.transactions.push(payload); }
      return s;
    });
  }else if(kind==="account"){
    var aid = form.getAttribute("data-id");
    if(!aid || aid==="undefined") aid = null;
    var cls = form.getAttribute("data-cls");
    var name = (fd.get("name")||"").trim();
    if(!name){ toast("이름을 입력해 주세요."); return; }
    var initial = Math.round(Number(fd.get("initial"))||0);
    var groupId = fd.get("groupId") || null;
    var payload2 = {id: aid || uid(), name:name, cls:cls, initial:initial, groupId:groupId};
    commit(function(s){
      if(aid){ s.accounts = s.accounts.map(function(a){ return a.id===aid ? Object.assign({}, a, payload2) : a; }); }
      else{ s.accounts.push(payload2); }
      return s;
    });
  }else if(kind==="category"){
    var ccls = form.getAttribute("data-cls");
    var cid = form.getAttribute("data-id");
    if(!cid || cid==="undefined") cid = null;
    var cname = (fd.get("name")||"").trim();
    if(!cname){ toast("이름을 입력해 주세요."); return; }
    var swatch = fd.get("swatch") || "other";
    var budget = fd.get("budget");
    var cgroupId = fd.get("groupId") || null;
    var expenseType = ccls==="expense" ? (fd.get("expenseType") || "variable") : null;
    commit(function(s){
      var newId = cid || uid();
      var payload3 = {id:newId, name:cname, cls:ccls, swatch:swatch, groupId:cgroupId};
      if(expenseType) payload3.expenseType = expenseType;
      if(cid){ s.accounts = s.accounts.map(function(c){ return c.id===cid ? Object.assign({}, c, payload3) : c; }); }
      else{ s.accounts.push(payload3); }
      if(ccls==="expense"){
        if(budget && Number(budget)>0) s.budgets[newId] = Math.round(Number(budget));
        else delete s.budgets[newId];
      }
      return s;
    });
  }else if(kind==="group"){
    var grcls = form.getAttribute("data-cls");
    var grid = form.getAttribute("data-id");
    if(!grid || grid==="undefined") grid = null;
    var grname = (fd.get("name")||"").trim();
    if(!grname){ toast("그룹 이름을 입력해 주세요."); return; }
    var grpayload = {id: grid || uid(), cls:grcls, name:grname};
    commit(function(s){
      if(grid){ s.groups = s.groups.map(function(g){ return g.id===grid ? grpayload : g; }); }
      else{ s.groups.push(grpayload); }
      return s;
    });
  }
});

async function exportCsv(){
  var rows = [["날짜","유형","차변계정","대변계정","금액","메모"]];
  state.transactions.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(t){
    var k = kindById(deriveKind(t.debitId,t.creditId));
    var d = acctById(t.debitId), c = acctById(t.creditId);
    rows.push([t.date, k?k.label:"기타", d?d.name:"", c?c.name:"", t.amount, t.memo||""]);
  });
  var csv = rows.map(function(r){
    return r.map(function(v){
      var s = String(v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(",");
  }).join("\r\n");
  var withBom = "﻿"+csv;
  var dl = await getDownloads();
  if(!dl){ toast("이 화면에서는 내보내기를 사용할 수 없어요."); return; }
  try{
    await dl.save({filename:"차곡가계부_"+todayIso()+".csv", data:withBom});
    toast("CSV 파일로 저장했어요.");
  }catch(err){
    if(err && err.code!=="declined") toast("내보내기에 실패했어요.");
  }
}

/* ================= 드래그 앤 드롭 ================= */
var dragState = null; // {element, startY, container}

function initDragAndDrop(){
  document.addEventListener('mousedown', function(e){
    // 설정 탭의 항목/그룹이나 버튼이 아닌 부분 클릭 감지
    var item = e.target.closest('.settings-item, .catrow');
    if(item && !e.target.closest('button')){
      e.preventDefault();
      e.stopPropagation();

      dragState = {
        element: item,
        startY: e.clientY,
        container: item.closest('[data-settings-container]')
      };
      item.classList.add('dragging');
      item.style.opacity = '0.5';
      return;
    }
  });

  document.addEventListener('mousemove', function(e){
    if(!dragState) return;

    var container = dragState.container;
    var containerRect = container.getBoundingClientRect();
    var currentY = e.clientY;
    var deltaY = currentY - dragState.startY;

    // 🔒 컨테이너 범위 안에서만 처리 (범위 밖이면 중단)
    if(currentY < containerRect.top || currentY > containerRect.bottom){
      return;
    }

    if(Math.abs(deltaY) > 10){
      var item = dragState.element;
      var itemType = item.getAttribute('data-type');

      if(!item.classList.contains('is-dragging-active')){
        item.classList.add('is-dragging-active');
      }

      // 🔑 대항목과 소항목을 분리해서 처리
      var comparisonItems;

      if(itemType === 'group'){
        // 대항목: 다른 대항목들하고만 비교
        comparisonItems = Array.from(container.querySelectorAll('.settings-item[data-type="group"]'));
      } else {
        // 소항목: 다른 소항목들하고만 비교
        comparisonItems = Array.from(container.querySelectorAll('.settings-item[data-type="account"], .catrow'));
      }

      var currentIdx = comparisonItems.indexOf(item);

      // 가장 가까운 같은 타입의 항목만 찾기
      var closestItem = null;
      var closestDistance = Infinity;

      comparisonItems.forEach(function(el, idx){
        if(el === item) return;

        var rect = el.getBoundingClientRect();
        var midpoint = rect.top + rect.height / 2;
        var distance = Math.abs(currentY - midpoint);

        if(distance < closestDistance){
          closestDistance = distance;
          closestItem = el;
        }
      });

      // 가장 가까운 항목과의 위치만 비교하여 한 번만 이동
      if(closestItem){
        var rect = closestItem.getBoundingClientRect();
        var midpoint = rect.top + rect.height / 2;
        var closestIdx = comparisonItems.indexOf(closestItem);

        if(currentY < midpoint && closestIdx <= currentIdx){
          // 위로 이동
          container.insertBefore(item, closestItem);
          dragState.startY = currentY;
        } else if(currentY > midpoint && closestIdx >= currentIdx){
          // 아래로 이동
          if(closestItem.nextElementSibling){
            container.insertBefore(item, closestItem.nextElementSibling);
          } else {
            container.appendChild(item);
          }
          dragState.startY = currentY;
        }
      }
    }
  });

  document.addEventListener('mouseup', function(e){
    if(!dragState) return;

    var item = dragState.element;
    item.classList.remove('dragging');
    item.classList.remove('is-dragging-active');
    item.style.opacity = '';

    var cls = dragState.container.getAttribute('data-settings-container');
    syncFlatOrder(cls);

    dragState = null;
  });
}

/* 평면 리스트 구조의 순서 동기화 (그룹과 항목 모두) */
function syncFlatOrder(cls){
  commit(function(s){
    var container = document.querySelector('[data-settings-container="'+cls+'"]');
    if(!container) return s;

    // DOM에서 평면 리스트 읽기
    var allItems = Array.from(container.querySelectorAll('.settings-item, .catrow'));

    // 📍 각 소항목의 그룹을 안전하게 업데이트 (위의 가장 가까운 그룹 기준, 없으면 유지)
    allItems.forEach(function(el, idx){
      if(el.getAttribute('data-type') === 'account'){
        var newGroupId = null;

        // 현재 항목 위의 가장 가까운 그룹 헤더 찾기
        for(var i = idx - 1; i >= 0; i--){
          if(allItems[i].getAttribute('data-type') === 'group'){
            newGroupId = allItems[i].getAttribute('data-id');
            break;
          }
        }

        // 그룹을 찾은 경우만 업데이트 (없으면 원래 그룹 유지)
        if(newGroupId){
          el.setAttribute('data-group-id', newGroupId);
        }
      }
    });

    var newGroupOrder = [];
    var accountsByGroup = {}; // {groupId: [accountIds]}

    allItems.forEach(function(el){
      var type = el.getAttribute('data-type');
      var id = el.getAttribute('data-id');

      if(type === 'group'){
        // 그룹 헤더
        newGroupOrder.push(id);
        accountsByGroup[id] = [];
      } else if(type === 'account'){
        // 계정/카테고리 항목
        var groupId = el.getAttribute('data-group-id') || null;
        if(groupId){
          if(!accountsByGroup[groupId]) accountsByGroup[groupId] = [];
          accountsByGroup[groupId].push(id);
        }
      }
    });

    // state 업데이트
    if(!s.groups) s.groups = [];

    // 그룹 순서 업데이트
    var classGroups = s.groups.filter(function(g){ return g.cls === cls; });
    var reorderedGroups = [];
    newGroupOrder.forEach(function(id){
      var group = classGroups.find(function(g){ return g.id === id; });
      if(group) reorderedGroups.push(group);
    });
    var otherGroups = s.groups.filter(function(g){ return g.cls !== cls; });
    s.groups = reorderedGroups.concat(otherGroups);

    // 계정 순서 업데이트 (그룹별로)
    var classAccounts = s.accounts.filter(function(a){ return a.cls === cls; });
    var reorderedAccounts = [];

    newGroupOrder.forEach(function(groupId){
      var idsInGroup = accountsByGroup[groupId] || [];
      idsInGroup.forEach(function(id){
        var account = classAccounts.find(function(a){ return a.id === id; });
        if(account) reorderedAccounts.push(account);
      });
    });

    var otherAccounts = s.accounts.filter(function(a){ return a.cls !== cls; });
    s.accounts = reorderedAccounts.concat(otherAccounts);

    return s;
  });
}

function moveItem(cls, groupId, itemId, direction){
  commit(function(s){
    // 현재 그룹/클래스의 항목들 가져오기
    var items = s.accounts.filter(function(a){
      return a.cls === cls && (groupId ? a.groupId === groupId : !a.groupId);
    });

    // 항목 위치 찾기
    var idx = -1;
    for(var i = 0; i < items.length; i++){
      if(items[i].id === itemId){
        idx = i;
        break;
      }
    }

    if(idx === -1) return s;

    // 이동 가능한지 확인
    if(direction === 'up' && idx === 0) return s; // 첫 번째 항목은 위로 이동 불가
    if(direction === 'down' && idx === items.length - 1) return s; // 마지막 항목은 아래로 이동 불가

    // 항목 이동
    var newIdx = direction === 'up' ? idx - 1 : idx + 1;
    var temp = items[idx];
    items[idx] = items[newIdx];
    items[newIdx] = temp;

    // 전체 accounts 배열 재구성
    var newAccounts = [];
    s.accounts.forEach(function(a){
      if(a.cls === cls && (groupId ? a.groupId === groupId : !a.groupId)){
        var item = items.shift();
        if(item) newAccounts.push(item);
      } else {
        newAccounts.push(a);
      }
    });

    s.accounts = newAccounts;
    return s;
  });
}

function handleItemReorder(cls, groupId, itemId, oldIndex, newIndex){
  commit(function(s){
    // DOM의 현재 순서를 읽어서 새로운 순서 결정
    var container = document.querySelector('[data-settings-container="'+cls+'"]');
    if(!container) return s;

    // 현재 DOM에서 같은 그룹/클래스의 항목들 순서 읽기
    var newOrder = [];
    if(groupId){
      // 그룹에 속한 항목들 - .bd-items 컨테이너에서 읽기
      var groupContainer = container.querySelector('[data-group-items="'+groupId+'"]');
      if(groupContainer){
        groupContainer.querySelectorAll('.catrow').forEach(function(el){
          newOrder.push(el.getAttribute('data-id'));
        });
      }
    } else {
      // ungrouped 항목들 - 직접 자식으로 있는 .catrow 읽기
      container.querySelectorAll('.catrow[data-row-group=""]').forEach(function(el){
        newOrder.push(el.getAttribute('data-id'));
      });
    }

    if(newOrder.length === 0) return s;

    // 현재 상태의 같은 그룹 항목들
    var currentItems = s.accounts.filter(function(a){
      return a.cls === cls && (groupId ? a.groupId === groupId : !a.groupId);
    });

    // 새 순서대로 재정렬
    var reorderedItems = [];
    newOrder.forEach(function(id){
      var item = currentItems.find(function(a){ return a.id === id; });
      if(item) reorderedItems.push(item);
    });

    // 전체 accounts 배열 재구성
    var newAccounts = [];
    var itemIndex = 0;
    s.accounts.forEach(function(a){
      if(a.cls === cls && (groupId ? a.groupId === groupId : !a.groupId)){
        // 이 항목이 현재 그룹/비그룹에 속함 - 새로운 순서에서 가져오기
        if(itemIndex < reorderedItems.length){
          newAccounts.push(reorderedItems[itemIndex++]);
        }
      } else {
        // 다른 그룹/클래스에 속함 - 그대로 추가
        newAccounts.push(a);
      }
    });

    s.accounts = newAccounts;
    return s;
  });
}
